[tox]
envlist = py310, py311, py312, py313, py314, py315, coverage

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315, coverage

[testenv:coverage]
deps = coverage
commands =
    coverage run -m unittest
    coverage report

[testenv]
commands = python -m unittest
